<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عرض المجسّم — مركز الرجاء المسيحي</title>
  <link rel="preload" href="assets/fonts/SomarSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="./" aria-label="مركز الرجاء المسيحي — الصفحة الرئيسية">
      <img class="logo logo-light" src="assets/img/hope-center.svg" alt="مركز الرجاء المسيحي">
      <img class="logo logo-dark" src="assets/img/hope-center-white.svg" alt="مركز الرجاء المسيحي">
    </a>
    <p class="title">معرض <bdi>3D</bdi> · <bdi>AR</bdi> · <bdi>VR</bdi></p>
  </header>

  <main>
    <a class="back" href="./"><span id="back-icon"></span>كل المجسّمات</a>
    <div id="app" class="viewer-layout">
      <div class="stage">
        <model-viewer id="mv" camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1"
          ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" alt="">
          <button slot="ar-button" class="btn ar-btn" id="ar-btn"></button>
        </model-viewer>
      </div>

      <aside class="panel">
        <div>
          <h1 id="title">…</h1>
          <p id="desc" class="lead" style="margin:0"></p>
        </div>

        <div>
          <h2 style="font-size:16px;margin-bottom:6px">الأبعاد الحقيقية</h2>
          <div class="dims" aria-live="polite">
            <div><b id="dw">—</b><span>العرض</span></div>
            <div><b id="dh">—</b><span>الارتفاع</span></div>
            <div><b id="dd">—</b><span>العمق</span></div>
          </div>
        </div>

        <label style="display:flex;gap:10px;align-items:center;min-block-size:44px;cursor:pointer">
          <input type="checkbox" id="fixed" style="inline-size:20px;block-size:20px">
          <span>تثبيت الحجم الحقيقي في <bdi>AR</bdi> (منع التكبير والتصغير)</span>
        </label>

        <div class="btn-row">
          <a class="btn" id="vr-btn"></a>
          <button class="btn btn-outline" id="share-btn" type="button"></button>
        </div>

        <div class="notice" id="ar-hint" hidden></div>

        <div class="qr-box">
          <div id="qr" aria-hidden="true"></div>
          <p>امسح الرمز بكاميرا الموبايل لفتح هذا المجسّم على هاتفك ووضعه في مكانك الحقيقي.</p>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">Copyright © 2018 - <span id="y"></span> HOPE CENTER</footer>

  <script type="module">
    import { findModel, param, siteUrl, esc, icons, shareLink } from './assets/js/catalog.js';
    document.getElementById('y').textContent = new Date().getFullYear();
    document.getElementById('back-icon').innerHTML = icons.back;

    const id = param('m');
    const model = id ? await findModel(id).catch(() => null) : null;
    const app = document.getElementById('app');

    if (!model) {
      app.innerHTML = '<div class="notice">' + icons.info + '<div>هذا المجسّم غير موجود أو تم حذفه. <a href="./">العودة إلى المعرض</a></div></div>';
    } else {
      const mv = document.getElementById('mv');
      document.title = model.title + ' — مركز الرجاء المسيحي';
      document.getElementById('title').textContent = model.title;
      document.getElementById('desc').textContent = model.description || '';
      mv.alt = model.title;
      if (model.usdz) mv.setAttribute('ios-src', model.usdz);
      if (model.poster) mv.poster = model.poster;
      mv.src = model.src;

      document.getElementById('ar-btn').innerHTML = icons.ar + 'ضعه في مكانك (<bdi>AR</bdi>)';
      const vr = document.getElementById('vr-btn');
      vr.href = 'vr.html?m=' + encodeURIComponent(model.id);
      vr.innerHTML = icons.vr + 'الواقع الافتراضي (<bdi>VR</bdi>)';
      const share = document.getElementById('share-btn');
      share.innerHTML = icons.share + 'مشاركة الرابط';
      const pageUrl = siteUrl('view.html?m=' + encodeURIComponent(model.id));
      share.addEventListener('click', () => shareLink(model.title, pageUrl));

      new QRCode(document.getElementById('qr'), { text: pageUrl, width: 112, height: 112, colorDark: '#414042', colorLight: '#FFFFFF' });

      document.getElementById('fixed').addEventListener('change', (e) => {
        mv.setAttribute('ar-scale', e.target.checked ? 'fixed' : 'auto');
      });

      const fmt = (m) => m >= 1 ? m.toFixed(2) + ' م' : Math.round(m * 100) + ' سم';
      mv.addEventListener('load', () => {
        const d = mv.getDimensions();
        document.getElementById('dw').textContent = fmt(d.x);
        document.getElementById('dh').textContent = fmt(d.y);
        document.getElementById('dd').textContent = fmt(d.z);
        if (!mv.canActivateAR) {
          const hint = document.getElementById('ar-hint');
          hint.innerHTML = icons.info + '<div>هذا الجهاز لا يدعم الواقع المعزّز. افتح الرابط من موبايل (<bdi>Android</bdi> مع <bdi>ARCore</bdi> أو <bdi>iPhone</bdi>) عبر رمز <bdi>QR</bdi> أدناه.</div>';
          hint.hidden = false;
        }
      });
      mv.addEventListener('error', () => {
        app.querySelector('.stage').insertAdjacentHTML('beforeend', '<div class="notice" style="position:absolute;inset:16px;background:var(--color-bg)">' + icons.info + '<div>تعذّر تحميل ملف المجسّم: <bdi>' + esc(model.src) + '</bdi></div></div>');
      });
    }
  </script>
</body>
</html>
