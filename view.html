<!doctype html>
<html lang="ar" dir="rtl" data-title-key="view.pageTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <script src="assets/js/lang-boot.js"></script>
  <title>عرض المجسّم — مركز الرجاء المسيحي</title>
  <link rel="preload" href="assets/fonts/SomarSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="./" data-i18n-attr="aria-label:site.home">
      <img class="logo logo-light" src="assets/img/hope-center.svg" alt="" data-i18n-attr="alt:site.name">
      <img class="logo logo-dark" src="assets/img/hope-center-white.svg" alt="" data-i18n-attr="alt:site.name">
    </a>
    <div class="header-end">
      <p class="title" data-i18n="header.title"></p>
      <button class="btn btn-outline btn-sm lang-switch" id="lang-switch" type="button"></button>
      <a class="btn btn-outline btn-sm" id="auth-link" hidden></a>
    </div>
  </header>

  <main>
    <a class="back" href="./"><span id="back-icon"></span><span data-i18n="view.back"></span></a>
    <div id="app" class="viewer-layout">
      <div class="stage">
        <model-viewer id="mv" camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1"
          ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" alt="">
          <button slot="ar-button" class="btn ar-btn" id="ar-btn"></button>
        </model-viewer>
      </div>

      <aside class="panel">
        <div>
          <h1 id="title" dir="auto">…</h1>
          <p id="desc" class="lead" dir="auto" style="margin:0"></p>
        </div>

        <div>
          <h2 style="font-size:16px;margin-bottom:6px" data-i18n="view.dims"></h2>
          <div class="dims" aria-live="polite">
            <div><b id="dw">—</b><span data-i18n="dim.w"></span></div>
            <div><b id="dh">—</b><span data-i18n="dim.h"></span></div>
            <div><b id="dd">—</b><span data-i18n="dim.d"></span></div>
          </div>
        </div>

        <label style="display:flex;gap:10px;align-items:center;min-block-size:44px;cursor:pointer">
          <input type="checkbox" id="fixed" style="inline-size:20px;block-size:20px">
          <span data-i18n="view.fixed"></span>
        </label>

        <div class="btn-row">
          <a class="btn" id="vr-btn"></a>
          <button class="btn btn-outline" id="share-btn" type="button"></button>
        </div>

        <div class="notice" id="ar-hint" hidden></div>

        <div class="qr-box">
          <div id="qr" aria-hidden="true"></div>
          <p data-i18n="view.qr"></p>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">Copyright © 2018 - <span id="y"></span> HOPE CENTER</footer>

  <script type="module">
    import { findModel, param, siteUrl, esc, icons, shareLink, mountAuthLink } from './assets/js/catalog.js';
    import { t, setTitle, formatLength } from './assets/js/i18n.js';
    mountAuthLink(document.getElementById('auth-link'));
    document.getElementById('y').textContent = new Date().getFullYear();
    document.getElementById('back-icon').innerHTML = icons.back;

    const id = param('m');
    const model = id ? await findModel(id).catch(() => null) : null;
    const app = document.getElementById('app');

    if (!model) {
      app.innerHTML = '<div class="notice">' + icons.info + '<div>' + t('view.notFound') + '</div></div>';
    } else {
      const mv = document.getElementById('mv');
      setTitle(model.title, true);
      document.getElementById('title').textContent = model.title;
      document.getElementById('desc').textContent = model.description || '';
      mv.alt = model.title;
      if (model.usdz) mv.setAttribute('ios-src', model.usdz);
      if (model.poster) mv.poster = model.poster;
      mv.src = model.src;

      document.getElementById('ar-btn').innerHTML = icons.ar + t('ar.place');
      const vr = document.getElementById('vr-btn');
      vr.href = 'vr.html?m=' + encodeURIComponent(model.id);
      vr.innerHTML = icons.vr + t('vr.enter');
      const share = document.getElementById('share-btn');
      share.innerHTML = icons.share + t('share.btn');
      const pageUrl = siteUrl('view.html?m=' + encodeURIComponent(model.id));
      share.addEventListener('click', () => shareLink(model.title, pageUrl));

      new QRCode(document.getElementById('qr'), { text: pageUrl, width: 112, height: 112, colorDark: '#414042', colorLight: '#FFFFFF' });

      document.getElementById('fixed').addEventListener('change', (e) => {
        mv.setAttribute('ar-scale', e.target.checked ? 'fixed' : 'auto');
      });

      mv.addEventListener('load', () => {
        const d = mv.getDimensions();
        document.getElementById('dw').textContent = formatLength(d.x);
        document.getElementById('dh').textContent = formatLength(d.y);
        document.getElementById('dd').textContent = formatLength(d.z);
        if (!mv.canActivateAR) {
          const hint = document.getElementById('ar-hint');
          hint.innerHTML = icons.info + '<div>' + t('view.noAR') + '</div>';
          hint.hidden = false;
        }
      });
      mv.addEventListener('error', () => {
        app.querySelector('.stage').insertAdjacentHTML('beforeend', '<div class="notice" style="position:absolute;inset:16px;background:var(--color-bg)">' + icons.info + '<div>' + t('view.loadError') + ' <bdi>' + esc(model.src) + '</bdi></div></div>');
      });
    }
  </script>
</body>
</html>
