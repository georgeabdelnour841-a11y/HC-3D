<!doctype html>
<html lang="ar" dir="rtl" data-title-key="upload.pageTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="assets/js/lang-boot.js"></script>
  <title>رفع نموذج — مركز الرجاء المسيحي</title>
  <link rel="preload" href="assets/fonts/SomarSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="./" data-i18n-attr="aria-label:site.home">
      <img class="logo logo-light" src="assets/img/hope-center.svg" alt="" data-i18n-attr="alt:site.name">
      <img class="logo logo-dark" src="assets/img/hope-center-white.svg" alt="" data-i18n-attr="alt:site.name">
    </a>
    <div class="header-end">
      <span class="title" id="who"></span>
      <button class="btn btn-outline btn-sm lang-switch" id="lang-switch" type="button"></button>
      <button class="btn btn-outline btn-sm" id="logout" type="button" data-i18n="upload.logout"></button>
    </div>
  </header>

  <main>
    <a class="back" href="./"><span id="back-icon"></span><span data-i18n="upload.back"></span></a>
    <h1 data-i18n="upload.h1"></h1>
    <p class="lead" data-i18n="upload.lead"></p>

    <div class="upload-layout">
      <form id="form" class="form" novalidate>
        <div class="field">
          <label for="glb" data-i18n="upload.glb"></label>
          <input id="glb" type="file" accept=".glb,model/gltf-binary" required>
        </div>
        <div class="field">
          <label for="title" data-i18n="upload.title"></label>
          <input id="title" type="text" maxlength="120" dir="auto" required>
        </div>
        <div class="field">
          <label for="description" data-i18n="upload.description"></label>
          <textarea id="description" maxlength="1000" dir="auto"></textarea>
        </div>
        <div class="field">
          <label for="tags" data-i18n="upload.tags"></label>
          <input id="tags" type="text" dir="auto" data-i18n-attr="placeholder:upload.tagsPlaceholder">
          <small data-i18n="upload.tagsHint"></small>
        </div>
        <div class="field">
          <label for="usdz" data-i18n="upload.usdz"></label>
          <input id="usdz" type="file" accept=".usdz,model/vnd.usdz+zip">
          <small data-i18n="upload.usdzHint"></small>
        </div>
        <p class="error" id="form-error" role="alert" hidden></p>
        <div class="status-line" id="status" hidden><span class="spinner" aria-hidden="true"></span><span id="status-text"></span></div>
        <div class="btn-row">
          <button class="btn" type="submit" id="submit"></button>
        </div>
      </form>

      <div>
        <div class="stage preview-stage">
          <model-viewer id="mv" camera-controls touch-action="pan-y" shadow-intensity="1" interaction-prompt="none" data-i18n-attr="alt:upload.previewAlt"></model-viewer>
        </div>
        <div class="dims" style="margin-block-start:12px" aria-live="polite">
          <div><b id="dw">—</b><span data-i18n="dim.w"></span></div>
          <div><b id="dh">—</b><span data-i18n="dim.h"></span></div>
          <div><b id="dd">—</b><span data-i18n="dim.d"></span></div>
        </div>
        <div class="notice" id="scale-warn" style="margin-block-start:12px" hidden></div>
      </div>
    </div>

    <section class="section" aria-labelledby="mine-h">
      <h2 id="mine-h" data-i18n="upload.mine"></h2>
      <div class="mine" id="mine" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">Copyright © 2018 - <span id="y"></span> HOPE CENTER</footer>

  <script type="module">
    import { getClient, getUser, hasBackend, fromRow, BUCKET, esc, icons, toast, siteUrl, shareLink } from './assets/js/catalog.js';
    import { t, locale, formatLength } from './assets/js/i18n.js';
    document.getElementById('y').textContent = new Date().getFullYear();
    document.getElementById('back-icon').innerHTML = icons.back;
    document.getElementById('submit').innerHTML = icons.upload + t('upload.submit');

    const stop = (url) => { location.replace(url); return new Promise(() => {}); };
    if (!hasBackend) await stop('login.html');
    const sb = await getClient();
    const user = await getUser();
    if (!user) await stop('login.html?next=upload.html');

    document.getElementById('who').innerHTML = '<bdi>' + esc(user.email) + '</bdi>';
    document.getElementById('logout').addEventListener('click', async () => {
      await sb.auth.signOut();
      location.replace('./');
    });

    const MAX = 50 * 1024 * 1024;
    const $ = (id) => document.getElementById(id);
    const mv = $('mv');
    let dims = null;
    let objectUrl;

    function error(msg) { $('form-error').textContent = msg; $('form-error').hidden = !msg; }
    function status(msg) { $('status').hidden = !msg; $('status-text').textContent = msg || ''; }

    $('glb').addEventListener('change', () => {
      const f = $('glb').files[0];
      error('');
      dims = null;
      ['dw', 'dh', 'dd'].forEach((i) => ($(i).textContent = '—'));
      $('scale-warn').hidden = true;
      if (!f) return;
      if (!/\.glb$/i.test(f.name)) return error(t('upload.notGlb'));
      if (f.size > MAX) return error(t('upload.tooBig', { size: (f.size / 1048576).toFixed(1) }));
      if (!$('title').value) $('title').value = f.name.replace(/\.glb$/i, '').replace(/[_-]+/g, ' ');
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(f);
      mv.src = objectUrl;
    });

    mv.addEventListener('load', () => {
      const d = mv.getDimensions();
      dims = d;
      $('dw').textContent = formatLength(d.x); $('dh').textContent = formatLength(d.y); $('dd').textContent = formatLength(d.z);
      const biggest = Math.max(d.x, d.y, d.z);
      const w = $('scale-warn');
      if (biggest > 20 || biggest < 0.02) {
        w.innerHTML = icons.info + '<div>' + t('upload.scaleWarn', { size: formatLength(biggest) }) + '</div>';
        w.hidden = false;
      } else {
        w.hidden = true;
      }
    });
    mv.addEventListener('error', () => { if ($('glb').files[0]) error(t('upload.readError')); });

    async function put(path, body, contentType) {
      // Browsers give .glb/.usdz files an empty type, and supabase-js sends a File's own type
      // (falling back to application/octet-stream), so re-wrap it with the real one.
      const typed = new Blob([body], { type: contentType });
      const { error: e } = await sb.storage.from(BUCKET).upload(path, typed, { contentType, upsert: false });
      if (e) throw e;
      return path;
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      error('');
      const glb = $('glb').files[0];
      const usdz = $('usdz').files[0];
      const title = $('title').value.trim();
      if (!glb) return error(t('upload.pickGlb'));
      if (glb.size > MAX || (usdz && usdz.size > MAX)) return error(t('upload.eachUnder'));
      if (!title) return error(t('upload.needTitle'));
      if (!mv.loaded) return error(t('upload.waitPreview'));

      const base = `${user.id}/${crypto.randomUUID()}`;
      const uploaded = [];
      $('submit').disabled = true;
      try {
        status(t('upload.stGlb'));
        uploaded.push(await put(base + '.glb', glb, 'model/gltf-binary'));

        let posterPath = null;
        try {
          status(t('upload.stPoster'));
          const blob = await mv.toBlob({ mimeType: 'image/webp', qualityArgument: 0.85, idealAspect: true });
          const ext = blob.type === 'image/webp' ? 'webp' : 'png';
          posterPath = await put(`${base}.${ext}`, blob, blob.type || 'image/png');
          uploaded.push(posterPath);
        } catch (err) { console.warn('poster skipped', err); }

        let usdzPath = null;
        if (usdz) {
          status(t('upload.stUsdz'));
          usdzPath = await put(base + '.usdz', usdz, 'model/vnd.usdz+zip');
          uploaded.push(usdzPath);
        }

        status(t('upload.stSave'));
        const tags = $('tags').value.split(/[,،]/).map((tag) => tag.trim()).filter(Boolean).slice(0, 10);
        const { data, error: insErr } = await sb.from('models').insert({
          title, description: $('description').value.trim(), tags,
          glb_path: base + '.glb', usdz_path: usdzPath, poster_path: posterPath,
          width_m: dims?.x ?? null, height_m: dims?.y ?? null, depth_m: dims?.z ?? null,
        }).select().single();
        if (insErr) throw insErr;

        status('');
        $('form').reset();
        mv.src = '';
        ['dw', 'dh', 'dd'].forEach((i) => ($(i).textContent = '—'));
        toast(t('upload.published'));
        loadMine();
        shareLink(data.title, siteUrl('view.html?m=' + data.id));
      } catch (err) {
        console.error(err);
        if (uploaded.length) await sb.storage.from(BUCKET).remove(uploaded);
        status('');
        error(t('upload.failed') + ' ' + (err.message || err));
      } finally {
        $('submit').disabled = false;
      }
    });

    async function loadMine() {
      const box = $('mine');
      const { data, error: e } = await sb.from('models').select('*').eq('owner', user.id).order('created_at', { ascending: false });
      if (e) { box.innerHTML = '<p class="error">' + t('upload.listError') + '</p>'; return; }
      if (!data.length) { box.innerHTML = '<div class="empty">' + t('upload.noneYet') + '</div>'; return; }
      box.innerHTML = data.map((r) => {
        const m = fromRow(sb, r);
        return `<div class="mine-row" data-id="${m.id}">
          ${m.poster ? `<img src="${esc(m.poster)}" alt="" loading="lazy">` : '<img alt="">'}
          <div class="grow"><b dir="auto">${esc(m.title)}</b><span>${new Date(r.created_at).toLocaleDateString(locale, { day: 'numeric', month: 'long', year: 'numeric' })}</span></div>
          <a class="btn btn-outline btn-sm" href="view.html?m=${m.id}">${t('upload.view')}</a>
          <button class="btn btn-outline btn-sm" type="button" data-act="share">${icons.share}${t('share.short')}</button>
          <button class="btn btn-danger btn-sm" type="button" data-act="delete">${t('upload.delete')}</button>
        </div>`;
      }).join('');
      box.onclick = async (ev) => {
        const btn = ev.target.closest('button[data-act]');
        if (!btn) return;
        const row = data.find((r) => r.id === btn.closest('.mine-row').dataset.id);
        if (btn.dataset.act === 'share') return shareLink(row.title, siteUrl('view.html?m=' + row.id));
        if (!confirm(t('upload.confirmDelete', { title: row.title }))) return;
        btn.disabled = true;
        const { error: delErr } = await sb.from('models').delete().eq('id', row.id);
        if (delErr) { btn.disabled = false; return toast(t('upload.deleteFailed')); }
        await sb.storage.from(BUCKET).remove([row.glb_path, row.usdz_path, row.poster_path].filter(Boolean));
        toast(t('upload.deleted'));
        loadMine();
      };
    }
    loadMine();
  </script>
</body>
</html>
