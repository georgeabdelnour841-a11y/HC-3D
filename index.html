<!doctype html>
<html lang="ar" dir="rtl" data-title-key="index.pageTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <script src="assets/js/lang-boot.js"></script>
  <title>معرض المجسّمات ثلاثية الأبعاد — مركز الرجاء المسيحي</title>
  <meta name="description" content="اعرض المجسّمات ثلاثية الأبعاد بالواقع المعزّز (AR) والواقع الافتراضي (VR) من الموبايل أو نظارة VR." data-i18n-attr="content:index.description">
  <link rel="preload" href="assets/fonts/SomarSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="./" data-i18n-attr="aria-label:site.home">
      <img class="logo logo-light" src="assets/img/hope-center.svg" alt="" data-i18n-attr="alt:site.name">
      <img class="logo logo-dark" src="assets/img/hope-center-white.svg" alt="" data-i18n-attr="alt:site.name">
    </a>
    <div class="header-end">
      <p class="title" data-i18n="header.title"></p>
      <button class="btn btn-outline btn-sm lang-switch" id="lang-switch" type="button"></button>
      <a class="btn btn-outline btn-sm" id="auth-link" hidden></a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1 data-i18n="index.h1"></h1>
        <p class="lead" data-i18n="index.lead"></p>
        <div id="hero-info" hidden>
          <span class="eyebrow" data-i18n="index.featured"></span>
          <p class="hero-model" id="hero-title" dir="auto"></p>
          <div class="btn-row hero-actions">
            <a class="btn btn-outline" id="hero-vr"></a>
            <a class="btn btn-outline" id="hero-details"></a>
          </div>
        </div>
      </div>
      <div class="stage hero-stage" id="hero-stage" hidden>
        <model-viewer id="hero-mv" camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1"
          auto-rotate auto-rotate-delay="1500" rotation-per-second="18deg" interaction-prompt="none"
          ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" alt="">
          <button slot="ar-button" class="btn ar-btn" id="hero-ar"></button>
        </model-viewer>
      </div>
    </section>

    <h2 id="all-h" data-i18n="index.allH"></h2>
    <div id="gallery" class="grid" aria-live="polite" aria-labelledby="all-h"></div>

    <section class="section" aria-labelledby="try-h">
      <h2 id="try-h" data-i18n="index.tryH"></h2>
      <p class="lead" data-i18n="index.tryLead"></p>
      <label class="dropzone" id="drop">
        <span id="drop-icon"></span>
        <p><b data-i18n="index.dropMain"></b></p>
        <small data-i18n="index.dropHint"></small>
        <input type="file" id="file" class="sr-only" accept=".glb,.gltf,model/gltf-binary,model/gltf+json">
      </label>
      <div id="local" class="section" hidden>
        <div class="stage">
          <model-viewer id="local-mv" camera-controls touch-action="pan-y" shadow-intensity="1" ar ar-modes="webxr quick-look" data-i18n-attr="alt:index.localAlt">
            <button slot="ar-button" class="btn ar-btn" id="local-ar" data-i18n="ar.short"></button>
          </model-viewer>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">Copyright © 2018 - <span id="y"></span> HOPE CENTER</footer>

  <script type="module">
    import { loadCatalog, esc, icons, mountAuthLink, hasBackend } from './assets/js/catalog.js';
    import { t } from './assets/js/i18n.js';
    import { FEATURED_MODEL_ID } from './assets/js/config.js';
    mountAuthLink(document.getElementById('auth-link'));
    document.getElementById('y').textContent = new Date().getFullYear();
    document.getElementById('drop-icon').innerHTML = icons.upload;

    // Hero: the configured featured model, or the newest one. The poster shows at once while the GLB loads.
    function showFeatured(m) {
      const mv = document.getElementById('hero-mv');
      if (m.poster) mv.poster = m.poster;
      if (m.usdz) mv.setAttribute('ios-src', m.usdz);
      mv.alt = m.title;
      mv.src = m.src;
      document.getElementById('hero-title').textContent = m.title;
      document.getElementById('hero-ar').innerHTML = icons.ar + t('ar.place');
      const vr = document.getElementById('hero-vr');
      vr.href = 'vr.html?m=' + encodeURIComponent(m.id);
      vr.innerHTML = icons.vr + t('vr.enter');
      const details = document.getElementById('hero-details');
      details.href = 'view.html?m=' + encodeURIComponent(m.id);
      details.innerHTML = icons.share + t('index.details');
      document.getElementById('hero-info').hidden = false;
      document.getElementById('hero-stage').hidden = false;
    }

    const gallery = document.getElementById('gallery');
    try {
      const models = await loadCatalog();
      const featured = models.find((m) => m.id === FEATURED_MODEL_ID) || models[0];
      if (featured) showFeatured(featured);
      gallery.innerHTML = models.length
        ? models.map((m) => `
        <a class="card" href="view.html?m=${encodeURIComponent(m.id)}">
          <span class="thumb">${m.poster
            ? `<img src="${esc(m.poster)}" alt="" loading="lazy">`
            : `<model-viewer src="${esc(m.src)}" loading="lazy" reveal="auto" interaction-prompt="none" disable-zoom disable-pan auto-rotate auto-rotate-delay="0" rotation-per-second="20deg" alt="${esc(m.title)}"></model-viewer>`}</span>
          <span class="body">
            <h3 dir="auto">${esc(m.title)}</h3>
            ${m.description ? `<p dir="auto">${esc(m.description)}</p>` : ''}
            ${m.tags?.length ? `<span class="tags">${m.tags.map((tag) => `<span class="tag" dir="auto">${esc(tag)}</span>`).join('')}</span>` : ''}
          </span>
        </a>`).join('')
        : '<div class="empty">' + t(hasBackend ? 'index.emptyBackend' : 'index.emptyStatic') + '</div>';
    } catch (e) {
      gallery.innerHTML = '<div class="notice">' + icons.info + '<div>' + t('index.loadError') + '</div></div>';
      console.error(e);
    }

    // Local preview: object URL, never uploaded.
    const drop = document.getElementById('drop');
    const input = document.getElementById('file');
    const local = document.getElementById('local');
    const mv = document.getElementById('local-mv');
    let lastUrl;
    function show(file) {
      if (!file || !/\.(glb|gltf)$/i.test(file.name)) return;
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(file);
      mv.src = lastUrl;
      mv.alt = file.name;
      local.hidden = false;
      local.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
    input.addEventListener('change', () => show(input.files[0]));
    ['dragenter', 'dragover'].forEach((type) => drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add('is-over'); }));
    ['dragleave', 'drop'].forEach((type) => drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.remove('is-over'); }));
    drop.addEventListener('drop', (e) => show(e.dataTransfer.files[0]));
  </script>
</body>
</html>
