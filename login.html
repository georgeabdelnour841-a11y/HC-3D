<!doctype html>
<html lang="ar" dir="rtl" data-title-key="login.pageTitle">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <script src="assets/js/lang-boot.js"></script>
  <title>تسجيل الدخول — مركز الرجاء المسيحي</title>
  <link rel="preload" href="assets/fonts/SomarSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="./" data-i18n-attr="aria-label:site.home">
      <img class="logo logo-light" src="assets/img/hope-center.svg" alt="" data-i18n-attr="alt:site.name">
      <img class="logo logo-dark" src="assets/img/hope-center-white.svg" alt="" data-i18n-attr="alt:site.name">
    </a>
    <div class="header-end">
      <p class="title" data-i18n="header.title"></p>
      <button class="btn btn-outline btn-sm lang-switch" id="lang-switch" type="button"></button>
    </div>
  </header>

  <main class="narrow">
    <!-- Sign in -->
    <form id="login" class="form" hidden>
      <h1 data-i18n="login.h1"></h1>
      <p class="lead" data-i18n="login.lead"></p>
      <div class="field">
        <label for="email" data-i18n="login.email"></label>
        <input id="email" type="email" autocomplete="email" dir="ltr" required>
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password"></label>
        <input id="password" type="password" autocomplete="current-password" dir="ltr" required>
      </div>
      <p class="error" id="login-error" role="alert" hidden></p>
      <div class="btn-row">
        <button class="btn" type="submit" data-i18n="login.submit"></button>
        <button class="btn btn-outline" type="button" id="forgot" data-i18n="login.forgot"></button>
      </div>
    </form>

    <!-- Set password: after an invite or a reset link -->
    <form id="set-password" class="form" hidden>
      <h1 id="sp-title" data-i18n="login.setTitle"></h1>
      <p class="lead" data-i18n="login.setLead"></p>
      <div class="field">
        <label for="new-password" data-i18n="login.newPassword"></label>
        <input id="new-password" type="password" autocomplete="new-password" dir="ltr" minlength="8" required>
        <small data-i18n="login.minLength"></small>
      </div>
      <p class="error" id="sp-error" role="alert" hidden></p>
      <button class="btn" type="submit" data-i18n="login.save"></button>
    </form>

    <div id="not-configured" class="notice" hidden></div>
  </main>

  <script type="module">
    import { getClient, hasBackend, icons, toast } from './assets/js/catalog.js';
    import { t } from './assets/js/i18n.js';

    // Read the link type before supabase-js consumes the URL hash.
    const hash = new URLSearchParams(location.hash.slice(1));
    const linkType = hash.get('type');
    const linkError = hash.get('error_description');
    const next = new URLSearchParams(location.search).get('next') || 'upload.html';
    const go = () => location.replace(/^[\w.-]+\.html/.test(next) ? next : 'upload.html');
    const showError = (el, msg) => { el.textContent = msg; el.hidden = false; };

    const login = document.getElementById('login');
    const setPw = document.getElementById('set-password');

    if (!hasBackend) {
      const nc = document.getElementById('not-configured');
      nc.innerHTML = icons.info + '<div>' + t('login.notConfigured') + '</div>';
      nc.hidden = false;
    } else {
      const sb = await getClient();
      const { data: { session } } = await sb.auth.getSession();

      if (linkType === 'invite' || linkType === 'recovery') {
        if (linkType === 'recovery') document.getElementById('sp-title').textContent = t('login.resetTitle');
        setPw.hidden = false;
        if (!session) showError(document.getElementById('sp-error'), t('login.linkExpired'));
      } else if (session) {
        go();
      } else {
        login.hidden = false;
        if (linkError) showError(document.getElementById('login-error'), t('login.linkInvalid'));
      }

      login.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = login.querySelector('[type=submit]');
        btn.disabled = true;
        const { error } = await sb.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        });
        btn.disabled = false;
        if (error) return showError(document.getElementById('login-error'), t('login.badCredentials'));
        go();
      });

      document.getElementById('forgot').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const err = document.getElementById('login-error');
        if (!email) return showError(err, t('login.emailFirst'));
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL('login.html', location.href).href });
        if (error) return showError(err, t('login.sendFailed'));
        err.hidden = true;
        toast(t('login.resetSent'));
      });

      setPw.addEventListener('submit', async (e) => {
        e.preventDefault();
        const { error } = await sb.auth.updateUser({ password: document.getElementById('new-password').value });
        if (error) return showError(document.getElementById('sp-error'), t('login.saveFailed') + ' ' + error.message);
        history.replaceState(null, '', location.pathname);
        go();
      });
    }
  </script>
</body>
</html>
